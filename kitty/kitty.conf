# ── Cyberpunk Capricorn / Kitty ─────────────────────────────────────
# Palette mirrors ~/.local/share/konsole/CyberpunkCapricorn.colors
font_family      MesloLGM Nerd Font Mono
bold_font        auto
italic_font      auto
font_size        11.0
adjust_line_height 105%

foreground            #f5f0f2
background            #070509
selection_foreground  #070509
selection_background  #ff2038

cursor                #ff2038
cursor_text_color     #070509
cursor_shape          block
cursor_blink_interval 0.5

url_color             #b14cff
active_border_color   #ff2038
inactive_border_color #241018
active_tab_background   #ff2038
active_tab_foreground   #070509
inactive_tab_background #0c080b
inactive_tab_foreground #8f5a66
tab_bar_margin_width  8
tab_bar_style         powerline
tab_powerline_style   slanted
tab_bar_min_tabs      2

color0  #080609
color8  #26121a
color1  #ff4d60
color9  #ff7382
color2  #0dff6e
color10 #82ffb4
color3  #ff2038
color11 #fff66e
color4  #0dff6e
color12 #78f5ff
color5  #a3145e
color13 #d278a0
color6  #0dc86e
color14 #78f0f5
color7  #e2d7dc
color15 #ffffff

window_padding_width 12
background_opacity   0.75
confirm_os_window_close 0
enable_audio_bell    no
scrollback_lines     12000
mouse_hide_wait      2.0
copy_on_select       yes
shell_integration    enabled

# motion
cursor_trail          3
cursor_trail_decay    0.15 0.55
cursor_trail_start_threshold 2
background_blur       18
dynamic_background_opacity yes
